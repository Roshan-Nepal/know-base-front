services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: know-base-frontend
    restart: unless-stopped
    ports:
      - "5173:80"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

    # Healthcheck
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
